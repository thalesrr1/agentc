<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AgentC">
  <title>AgentC</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="#27272a" stroke-width="2"/>
  <g filter="url(#glow)" stroke="url(#emerald)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="256,72 96,160 256,248 416,160 256,72"/>
    <polyline points="96,272 256,360 416,272"/>
    <polyline points="96,384 256,472 416,384"/>
  </g>
  <circle cx="256" cy="256" r="6" fill="#10b981" opacity="0.9"/>
</svg>